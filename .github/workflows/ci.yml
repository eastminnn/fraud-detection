name: CI

on:
  pull_request:
    branches: [ develop, main ]
  push:
    branches: [ develop, main ]

jobs:
  build:
    name: 빌드 및 테스트
    runs-on: ubuntu-latest

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      # Testcontainers 가 PostgreSQL 컨테이너를 띄우므로 마이그레이션과 JPA 매핑까지 실제 DB 로 검증된다.
      - name: 빌드 및 테스트
        run: ./gradlew build --no-daemon

      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
