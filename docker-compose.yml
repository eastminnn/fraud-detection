services:
  postgres:
    image: postgres:17
    container_name: fraud-postgres
    environment:
      POSTGRES_DB: fraud
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraud"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:8-alpine
    container_name: fraud-redis
    command: ["redis-server", "--maxmemory", "192mb"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M

  redisinsight:
    image: redis/redisinsight:latest
    container_name: fraud-redisinsight
    ports:
      - "5540:5540"
    profiles: ["observability"]
    depends_on:
      - redis

volumes:
  postgres-data:
