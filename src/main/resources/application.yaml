spring:
  application:
    name: fraud-detection

  datasource:
    url: jdbc:postgresql://localhost:5432/fraud
    username: fraud
    password: fraud

  data:
    redis:
      host: localhost
      port: 6379

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
